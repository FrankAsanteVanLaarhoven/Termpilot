[project]
name = "termpilot-backend"
version = "0.1.0"
description = "TermPilot: verified control tower for student life"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "greenlet>=3.1.0",
  "httpx>=0.27.0",
  "openai>=1.54.0",
  "ortools>=9.11.0",
  "python-dateutil>=2.9.0",
  "icalendar>=6.0.0",
  "python-multipart>=0.0.12",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"alembic/*" = ["E501"]
"migrations/*" = ["E501"]
"app/main.py" = ["E402"]
"index.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["app", "tests"]
plugins = []
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true

[tool.ruff.format]
quote-style = "double"

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python scripts/copy_fixtures.py"
