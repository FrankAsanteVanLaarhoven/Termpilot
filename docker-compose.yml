services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      TERMPILOT_ENV: demo
      DATABASE_URL: sqlite+aiosqlite:////data/termpilot.db
      GROK_MODE: fake
      TERMPILOT_NOW: "2026-09-05T08:00:00+01:00"
      TERMPILOT_FRONTEND_ORIGIN: http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - termpilot-data:/data
      - ./fixtures:/app/fixtures:ro

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: termpilot
      POSTGRES_PASSWORD: termpilot
      POSTGRES_DB: termpilot
    ports:
      - "5432:5432"
    volumes:
      - termpilot-pg:/var/lib/postgresql/data
    profiles: ["production"]

volumes:
  termpilot-data:
  termpilot-pg:
