name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv venv --python 3.12 .venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff format --check app tests
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/mypy app tests
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python ../scripts/demo_smoke.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
